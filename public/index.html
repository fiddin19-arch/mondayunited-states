      <div class="mt-3 space-y-3">${DISERTASI.map((q, qi) => `<div><p class="text-sm">“${q}”</p><div class="mt-1 flex gap-2">${['A', 'B', 'C'].map((o, oi) => `<button data-a="survey" data-v="${qi}:${oi}" aria-pressed="${U.sel.survey[qi] === oi}" class="size-9 rounded-lg text-sm ring-1 ring-white/10 bg-white/5 aria-pressed:bg-white aria-pressed:text-ink">${o}</button>`).join('')}</div></div>`).join('')}</div>
      <button data-a="nact" data-v="DUMMY" class="${btn('ghost')} w-full mt-4" ${Object.keys(U.sel.survey).length === 3 ? '' : 'disabled'}>Kumpulkan Nilai</button>`;

      <button data-a="nact" data-v="DUMMY" class="${btn('ghost')} w-full mt-4" ${Object.keys(U.sel.survey).length === 3 ? '' : 'disabled'}>Kirim Survei</button>`;
    const showSkip = !['WARGA', 'GURU_BESAR'].includes(r);

  }

  function chatLine(c) {

    return `<div class="flex gap-2 ${mine ? 'flex-row-reverse' : ''}"><div class="size-8 shrink-0 rounded-xl bg-ink-700 grid place-items-center">${persona(p.persona).e}</div>

      <p class="mt-1 text-sm">“Turunkan ${nm(pr)}!”</p>

      ${M.role === 'PENGAMAT' && (M.observations || []).length ? `<div class="mt-4 pt-3 border-t border-white/5">${sectionTitle('📊 Pengamatan')}<ul class="mt-2 space-y-1 text-xs">${M.observations.map((o) => `<li>M${o.night}: ${nm(P(o.id))} → ${o.visited != null ? nm(P(o.visited)) : 'diam'}</li>`).join('')}</ul></div>` : ''}</div>`;

    if (md && md.type === 'keppres') h += `<div class="fixed inset-0 z-[75] grid place-items-center bg-ink/80 p-4"><div class="w-[min(92vw,420px)] rounded-2xl bg-kertas text-ink p-6 rise"><p class="font-display text-3xl uppercase">Tanda Tangani Keppres?</p><p class="font-mono text-xs mt-1 opacity-60">No. ${String(V.day).padStart(2, '0')}/KEPPRES/${esc(V.code)}</p><p class="mt-4 text-lg">“${esc(md.text)}”</p>
      <div class="mt-6 grid grid-cols-2 gap-2"><button data-a="modalClose" class="h-12 rounded-xl ring-1 ring-ink/20 font-semibold">Batal</button><button id="signHold" class="relative overflow-hidden h-12 rounded-xl bg-ink text-kertas font-semibold select-none touch-none"><span class="hold-fill absolute inset-0 bg-korup/70" style="transition-duration:.8s"></span><span class="relative">✒ Tahan untuk TTD</span></button></div></div></div>`;
    if (md && md.type === 'appeal') h += `<div class="fixed inset-0 z-[75] grid place-items-center bg-ink/80 p-4"><form data-form="appeal" class="w-[min(92vw,420px)] rounded-2xl bg-ink-800 ring-1 ring-istana/40 p-6 rise"><p class="font-display text-3xl uppercase text-istana">🙏 Mohon-Mohon</p><p class="text-sm text-zinc-400">Permohonan banding dikirim langsung ke meja Presiden. Hanya 1x per game.</p>
      <div class="mt-3 flex flex-wrap gap-2">${['Saya punya anak istri', 'Saya siap jadi justice collaborator', 'Saya hanya disuruh', 'Ini kriminalisasi!'].map((t) => `<button type="button" data-a="appealPreset" data-v="${t}" class="text-xs rounded-full px-3 py-1 bg-white/5 ring-1 ring-white/10 hover:bg-white/10">${t}</button>`).join('')}</div>
      <textarea id="appealText" name="t" maxlength="140" rows="3" class="mt-3 w-full rounded-xl bg-ink-900 ring-1 ring-white/10 p-3 text-base md:text-sm outline-none focus:ring-istana" placeholder="Yang Mulia Bapak/Ibu Presiden…"></textarea>
      <div class="mt-4 grid grid-cols-2 gap-2"><button type="button" data-a="modalClose" class="${btn('ghost')}">Batal</button><button class="${btn('istana')}">Ajukan Banding</button></div></form></div>`;
    if (md && md.type === 'headline') h += `<div class="fixed inset-0 z-[75] grid place-items-center bg-ink/80 p-4"><form data-form="headline" class="w-[min(92vw,460px)] rounded-2xl bg-ink-800 ring-1 ring-berita/50 p-6 rise"><p class="font-display text-3xl uppercase text-berita">📰 Hak Headline</p><p class="text-sm text-zinc-400">Tulisan Anda tayang di Breaking News pagi berikutnya sebagai “Kolom dari Balik Jeruji”. Maks. 90 karakter, sekali pakai.</p>
      <input id="headlineText" name="t" maxlength="90" autocomplete="off" class="mt-4 w-full h-12 rounded-xl bg-kertas text-ink font-mono text-base px-3 outline-none" placeholder="Yang menjebloskan saya…"><div class="mt-4 grid grid-cols-2 gap-2"><button type="button" data-a="modalClose" class="${btn('ghost')}">Nanti</button><button class="${btn('istana')}">Kirim ke Redaksi</button></div></form></div>`;
    if (md && md.type === 'mute' && V && M) h += `<div class="fixed inset-0 z-[75] grid place-items-center bg-ink/80 p-4"><div class="w-[min(92vw,400px)] rounded-2xl bg-ink-800 ring-1 ring-white/15 p-5 rise"><p class="font-display text-2xl uppercase">🔇 Bisukan Pemain</p><p class="text-sm text-zinc-400">Pesan dari pemain yang dibisukan tidak tampil di layar Anda. Hanya berlaku di HP Anda.</p>
      <div class="mt-3 max-h-[50vh] overflow-y-auto divide-y divide-white/5">${V.players.filter((p) => !p.bot && p.id !== M.id).map((p) => `<button data-a="mute" data-v="${esc(p.id)}" class="w-full flex items-center gap-3 py-2.5 text-left"><span class="text-2xl">${persona(p.persona).e}</span><span class="flex-1">${nm(p)}</span><span class="text-xs rounded-full px-2 py-1 ${U.muted.has(p.id) ? 'bg-korup text-white' : 'bg-white/10'}">${U.muted.has(p.id) ? 'Dibisukan' : 'Bisukan'}</span></button>`).join('') || '<p class="py-3 text-sm text-zinc-500">Tidak ada pemain lain.</p>'}</div>
      <button data-a="modalClose" class="${btn('ghost')} w-full mt-4">Tutup</button></div></div>`;
    if (md && md.type === 'peek' && M && M.role) h += `<div class="fixed inset-0 z-[75] grid place-items-center bg-ink/80 p-4" data-a="modalClose"><div class="w-[min(86vw,320px)] rise">${roleCardFront(M.role)}<div class="mt-3">${allyBox()}</div><p class="mt-3 text-xs text-zinc-500 text-center">Ketuk di mana saja untuk menutup</p></div></div>`;
    patch(document.getElementById('overlay'), h);
    bindHold();
  }

  // ------------------------------------------------------- DOM PATCH
  // Memperbarui hanya bagian yang berubah. Elemen yang sedang dipakai (kolom ketik, tombol tahan,
  // kartu yang sedang berputar) tidak pernah dibuat ulang, jadi keyboard HP tidak tertutup dan teks tidak hilang.
  function patch(root, html) {
    const tpl = document.createElement('template'); tpl.innerHTML = html;
    morphChildren(root, tpl.content);
  }
  function sameNode(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) return false;
    if (a.nodeType !== 1) return true;
    return (a.id || '') === (b.id || '') && (a.getAttribute('data-key') || '') === (b.getAttribute('data-key') || '');
  }
  function morph(from, to) {
    if (!sameNode(from, to)) { from.replaceWith(to); return; }
    if (from.nodeType === 3 || from.nodeType === 8) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    if (from.nodeType !== 1) return;
    for (const a of Array.from(from.attributes)) if (!to.hasAttribute(a.name)) from.removeAttribute(a.name);
    for (const a of Array.from(to.attributes)) if (from.getAttribute(a.name) !== a.value) from.setAttribute(a.name, a.value);
    if (from.tagName === 'INPUT' || from.tagName === 'TEXTAREA') { if ('disabled' in from) from.disabled = to.hasAttribute('disabled'); return; } // isi ketikan dibiarkan
    if (from.tagName === 'BUTTON') from.disabled = to.hasAttribute('disabled');
    morphChildren(from, to);
  }
  function morphChildren(from, to) {
    const fc = Array.from(from.childNodes), tc = Array.from(to.childNodes);
    for (let i = 0; i < tc.length; i++) { if (i < fc.length) morph(fc[i], tc[i]); else from.appendChild(tc[i]); }
    for (let i = tc.length; i < fc.length; i++) fc[i].remove();
  }
  const isDesk = () => window.matchMedia('(min-width: 768px)').matches;
  let lastDesk = null; window.addEventListener('resize', () => { const d = isDesk(); if (d !== lastDesk) { lastDesk = d; render(); } });

  // ------------------------------------------------------- RENDER
  const SCREENS = { LOBBY: scrLobby, REVEAL: scrReveal, ELECTION: scrElection, NIGHT: scrNight, MORNING: scrMorning, SIDANG: scrSidang, DECISION: scrSidang, END: scrEnd };
  function render() {
    const app = document.getElementById('app');
    const keep = {}; app.querySelectorAll('[data-scroll-key]').forEach((el) => { keep[el.dataset.scrollKey] = { l: el.scrollLeft, t: el.scrollTop, atBottom: el.scrollHeight - el.scrollTop - el.clientHeight < 40 }; });
    const y = window.scrollY;
    let html;
    if (U.screen === 'LANDING') html = scrLanding();
    else if (U.screen === 'IDENTITY') html = scrIdentity();
    else if (U.screen === 'ROOMS') html = scrRooms();
    else if (!V || !M) html = '<div class="min-h-screen grid place-items-center text-zinc-400">⏳ Memuat ruang sidang…</div>';
    else if (!M.role && V.phase !== 'LOBBY') html = '<div class="min-h-screen grid place-items-center text-zinc-400 p-6 text-center">⏳ Sidang sedang berjalan. Anda akan ikut di ronde berikutnya.</div>';
    else html = (SCREENS[V.phase] || scrLobby)();
    patch(app, html);
    app.querySelectorAll('[data-scroll-key]').forEach((el) => { const k = keep[el.dataset.scrollKey]; if (el.hasAttribute('data-autoscroll') && (!k || k.atBottom)) el.scrollTop = el.scrollHeight; else if (k) { el.scrollLeft = k.l; el.scrollTop = k.t; } });
    window.scrollTo(0, y);
    tickTimers(); renderOverlay();
  }
  function tickTimers() {
    if (!V || !V.endsAt) { document.querySelectorAll('[data-timer]').forEach((e) => (e.textContent = '—')); document.querySelectorAll('[data-timer-ring]').forEach((e) => e.setAttribute('stroke-dashoffset', '0')); return; }
    const left = Math.max(0, (V.endsAt - now()) / 1000), total = V.phaseDur || 30, sec = Math.ceil(left);
    const txt = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
    document.querySelectorAll('[data-timer]').forEach((e) => { e.textContent = txt; e.classList.toggle('text-korup', left < 10); e.classList.toggle('animate-pulse', left < 10); });
    document.querySelectorAll('[data-timer-ring]').forEach((e) => e.setAttribute('stroke-dashoffset', String(100.5 * (1 - left / total))));
  }
  setInterval(() => {
    tickTimers();
    if (V && V.lobby && V.lobby.cdAt) { const sec = Math.max(0, Math.ceil((V.lobby.cdAt - now()) / 1000)); document.querySelectorAll('[data-cd]').forEach((e) => { e.textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; e.classList.toggle('text-korup', sec <= 10); }); }
    if (U.screen === 'ROOMS' && Date.now() - U.roomsAt > 5000) loadRooms();
    if (U.screen === 'LANDING' && window.NET.hall && Date.now() - U.hallAt > 30000) loadHall();
    if (V && V.phase === 'NIGHT') { const idx = Math.floor(Date.now() / 6000); if (idx !== U.bannerIdx) { U.bannerIdx = idx; const b = document.querySelector('[data-banner]'); if (b) b.textContent = NIGHT_BANNERS[idx % NIGHT_BANNERS.length]; } }
  }, 250);

  function bindHold() {
    const hb = document.getElementById('holdBtn'); if (hb && !hb._b) { hb._b = 1; holdify(hb, 600, () => { U.flipped = true; const c = document.getElementById('roleCard'); if (c) c.dataset.flipped = 'true'; try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} setTimeout(render, 780); }); }
    const sh = document.getElementById('signHold'); if (sh && !sh._b) { sh._b = 1; holdify(sh, 800, () => { const md = U.modal; U.modal = null; renderOverlay(); send(md.action).then(() => { U.prisonerPick = null; }); }); }
  }
  function holdify(el, ms, done) {
    let t = null; const start = (e) => { e.preventDefault(); el.classList.add('holding'); t = setTimeout(() => { t = null; el.classList.remove('holding'); done(); }, ms); };
    const stop = () => { if (t) { clearTimeout(t); t = null; } el.classList.remove('holding'); };
    el.addEventListener('pointerdown', start); ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => el.addEventListener(ev, stop));
    el.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !t && !e.repeat) start(e); }); el.addEventListener('keyup', stop);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // ------------------------------------------------------- ACTIONS
  async function loadRooms() {
    U.roomsAt = Date.now();
    const r = await window.NET.listRooms(); if (U.screen !== 'ROOMS') return;
    U.rooms = r === null ? false : r; render();
  }
  async function enter() {
    const name = U.nick.trim(); if (!name || !U.persona) return;
    LS.set('mdu_nick', name); LS.set('mdu_persona', U.persona);
    U.busy = true; U.err = ''; render();
    try {
      const r = U.mode === 'local' ? await window.NET.local({ name, persona: U.persona })
        : await window.NET.connect({ action: U.mode, code: U.joinCode.join(''), name, persona: U.persona, pub: U.pub });
      if (r && r.err) { U.err = r.err; U.busy = false; render(); return; }
      U.busy = false; U.screen = 'GAME'; render();
    } catch (e) { U.err = 'Gagal terhubung: ' + (e && e.message ? e.message : e); U.busy = false; render(); }
  }
  function signSend(want) {
    U.signPending = { want, at: Date.now() }; render();
    send({ t: 'sign', on: want }).then((r) => { if (r && r.err) { U.signPending = null; render(); } });
    setTimeout(() => { if (U.signPending && U.signPending.want === want) { U.signPending = null; render(); } }, 6000);
  }
  const ACT = {
    goCreate() { U.mode = 'create'; U.err = ''; U.screen = 'IDENTITY'; render(); },
    goJoin() { const code = U.joinCode.join(''); if (!/^\d{4}$/.test(code)) { U.err = 'Masukkan 4 digit kode room.'; render(); return; } U.mode = 'join'; U.err = ''; U.screen = 'IDENTITY'; render(); },
    goLocal() { U.mode = 'local'; U.err = ''; U.screen = 'IDENTITY'; render(); },
    goQuick() { U.mode = 'quick'; U.err = ''; U.screen = 'IDENTITY'; render(); },
    goRooms() { U.err = ''; U.screen = 'ROOMS'; U.rooms = null; render(); loadRooms(); },
    refreshRooms() { U.rooms = null; render(); loadRooms(); },
    pickRoom(v) { U.joinCode = String(v).split(''); U.mode = 'join'; U.err = ''; U.screen = 'IDENTITY'; render(); },
    setPub(v) { U.pub = v === '1'; LS.set('mdu_pub', U.pub ? '1' : '0'); render(); },
    extend() { send({ t: 'extend' }); },
    fillBots() { send({ t: 'fillBots' }); },
    visibility() { send({ t: 'visibility', public: !V.settings.public }); },
    mute(v) { if (U.muted.has(v)) U.muted.delete(v); else U.muted.add(v); render(); },
    muteMenu() { U.modal = { type: 'mute' }; renderOverlay(); },
    back() { U.screen = 'LANDING'; U.err = ''; render(); loadHall(); },
    persona(v) { U.persona = v; render(); },
    enter,
    copyCode() { const t = V.code; try { navigator.clipboard.writeText(t).then(() => toast('⧉ Kode room disalin: ' + t), () => toast('Kode room: ' + t)); } catch (e) { toast('Kode room: ' + t); } },
    addBot() { send({ t: 'addBot' }); },
    kick(v) { send({ t: 'kick', id: v }); },
    lobbyPersona(v) { send({ t: 'persona', persona: v }); },
    autoDist() { send({ t: 'settings', settings: { auto: !V.settings.auto, dist: (V.dist && V.dist.d) || V.settings.dist } }); },
    dist(v, el) { const d = ((V.dist && V.dist.d) || V.settings.dist).slice(); const i = +el.dataset.k; d[i] = Math.max(0, d[i] + +v); send({ t: 'settings', settings: { dist: d } }); },
    setOpt(v, el) { const k = el.dataset.k, n = +v; send({ t: 'settings', settings: k === 'scandalTarget' ? { scandalTarget: n } : { timers: { [k]: n } } }); },
    start() { send({ t: 'start' }); },
    leave() {
      if (V && !['LOBBY', 'END'].includes(V.phase) && !(U.leaveArmed && Date.now() - U.leaveArmed < 4000)) { U.leaveArmed = Date.now(); toast('Ketuk "Keluar" sekali lagi untuk meninggalkan sidang yang sedang berjalan.', 'korup'); return; }
      send({ t: 'leave' }); window.NET.leave(); resetToLanding();
    },
    hideCard() { U.flipped = false; render(); },
    ready() { send({ t: 'ready' }); },
    vote(v) { send({ t: 'vote', cand: v }); },
    sel(v, el) { U.sel[el.dataset.k] = v; render(); },
    tab(v) { U.sel.tab = v; U.sel.target = null; U.modal = null; render(); },
    kpkTab(v) { U.sel.kpk = v; U.sel.target = null; render(); },
    confirmRecruit() { U.modal = 'confirmRecruit'; render(); },
    survey(v) { const [q, o] = v.split(':').map(Number); U.sel.survey[q] = o; render(); },
    wall() { U.wall = (U.wall + 1) % 30; render(); },
    nact(kind) { U.modal = null; send({ t: 'night', kind, target: U.sel.target }); },
    nskip() { send({ t: 'night', kind: 'DUMMY' }); },
    korSubmit() { send({ t: 'night', kind: 'SCANDAL', good: !!U.sel.good, target: U.sel.target, card: U.sel.good ? null : (U.sel.card || (M.hand || [])[0]) }); },
    korGood(v) { U.sel.good = v === '1'; U.sel.target = null; render(); },
    korAgree() { send({ t: 'night', kind: 'AGREE' }); },
    pltSubmit() { send({ t: 'night', kind: 'SCANDAL', target: U.sel.pltTarget, card: U.sel.pltCard || (M.hand || [])[0] }).then((r) => { if (r && r.ok) toast('🐀 Kasus fiktif terdaftar. Sekarang jalankan aksi role Anda.', 'korup'); }); },
    mtab(v) { U.mobileTab = v; render(); },
    react(v) { send({ t: 'react', emoji: v }); },
    sign() { if (M.signed || (U.signPending && Date.now() - U.signPending.at < 6000)) return; signSend(true); },
    unsign() {
      if (!M.signed) return;
      if (!(U.unsignArmed && Date.now() - U.unsignArmed < 4000)) { U.unsignArmed = Date.now(); render(); setTimeout(render, 4100); return; }
      U.unsignArmed = 0; signSend(false);
    },
    skip() { send({ t: 'skip' }); },
    testify() { send({ t: 'testify' }); },
    appeal() { U.modal = { type: 'appeal' }; renderOverlay(); },
    appealPreset(v) { const t = document.getElementById('appealText'); if (t) t.value = v; },
    headline() { U.modal = { type: 'headline' }; renderOverlay(); },
    peek() { U.modal = { type: 'peek' }; renderOverlay(); },
    modalClose() { U.modal = null; render(); },
    veto(v) { send({ t: 'veto', case: v }); },
    presDrawer() { U.presDrawer = !U.presDrawer; render(); },
    freeToggle() { U.prisonerPick = U.prisonerPick === null ? -1 : null; render(); },
    pickPrisoner(v) { U.prisonerPick = v; render(); },
    appealPick(v) { U.prisonerPick = v; render(); },
    decide(kind, el) {
      let text = '', action = { t: 'decide', kind };
      if (kind === 'JAIL') { const s = el.dataset.s; action.suspect = s; const c = openCases().find((x) => x.suspect === s); text = `Menjebloskan ${P(s).name} atas ${c ? card(c.card).title : 'tuduhan'}.`; }
      else if (kind === 'FREE') { action.prisoner = U.prisonerPick; text = `Membebaskan ${P(U.prisonerPick).name} dari Rutan Negara.`; }
      else text = 'Tidak mengambil tindakan. Tuduhan dikesampingkan.';
      U.modal = { type: 'keppres', action, text }; renderOverlay();
    },
    replay() { send({ t: 'replay' }); },
  };

  document.addEventListener('click', (e) => { const a = e.target.closest('[data-a]'); if (!a || a.disabled) return; const f = ACT[a.dataset.a]; if (f) f(a.dataset.v, a); });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'nick') { U.nick = e.target.value; const c = document.getElementById('nickCount'); if (c) c.textContent = `${U.nick.length}/14`; const b = document.querySelector('[data-a="enter"]'); if (b) b.disabled = !(U.persona && U.nick.trim()); }
    if (e.target.dataset && e.target.dataset.otp != null) { const i = +e.target.dataset.otp; e.target.value = e.target.value.replace(/\D/g, '').slice(-1); U.joinCode[i] = e.target.value; if (e.target.value && i < 3) document.querySelector(`[data-otp="${i + 1}"]`).focus(); }
  });
  document.addEventListener('paste', (e) => { if (e.target.dataset && e.target.dataset.otp != null) { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4); if (t.length === 4) { e.preventDefault(); U.joinCode = t.split(''); document.querySelectorAll('[data-otp]').forEach((el, i) => { el.value = U.joinCode[i] || ''; }); render(); } } });
  document.addEventListener('keydown', (e) => {
    if (e.target.dataset && e.target.dataset.otp != null) { if (e.key === 'Backspace' && !e.target.value) { const i = +e.target.dataset.otp; if (i > 0) document.querySelector(`[data-otp="${i - 1}"]`).focus(); } if (e.key === 'Enter') ACT.goJoin(); }
    if (e.target.id === 'nick' && e.key === 'Enter') enter();
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target, t = ((f.t && f.t.value) || '').trim();
    if (f.dataset.form === 'chat') { if (!t) return; f.t.value = ''; send(me() && me().jailed ? { t: 'letter', text: t } : { t: 'chat', text: t }); }
    if (f.dataset.form === 'dark') { if (!t) return; f.t.value = ''; send({ t: 'dark', text: t }); }
    if (f.dataset.form === 'appeal') { U.modal = null; renderOverlay(); send({ t: 'appeal', text: t }).then((r) => { if (r && r.ok) toast('📨 Banding terkirim ke meja Presiden.', 'istana'); }); }
    if (f.dataset.form === 'headline') { if (!t) return; U.modal = null; renderOverlay(); send({ t: 'headline', text: t }); }
  });

  // join code dari URL hash (#6262) memudahkan berbagi
  const m = /^#(\d{4})$/.exec(location.hash || ''); if (m) U.joinCode = m[1].split('');
  render(); loadHall();
  if (window.NET && window.NET.init) window.NET.init();
})();

</script>
